<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="hbmGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
    <linearGradient id="sramGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2937" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.5" />
    </filter>
  </defs>

  <style>
    .header { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 22px; fill: #f9fafb; }
    .sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #9ca3af; }
    .box-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 600; font-size: 16px; }
    .mono { font-family: "JetBrains Mono", Consolas, monospace; font-size: 13px; }
    .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #9ca3af; }
    .badge { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: bold; font-size: 11px; }
  </style>

  <rect width="950" height="480" rx="16" fill="url(#bgGrad)" stroke="#374151" stroke-width="1" />

  <!-- Header -->
  <text x="40" y="44" class="header">为什么标准 Attention 受限于“内存墙” (Memory Wall)？</text>
  <text x="40" y="68" class="sub">算力（Tensor Core）飞速增长，但 HBM 显存带宽增长滞后，中间矩阵的大量 IO 成为系统吞吐瓶颈</text>

  <!-- Left: Standard Attention -->
  <g transform="translate(40, 95)" filter="url(#cardShadow)">
    <rect width="415" height="350" rx="12" fill="url(#cardBg)" stroke="#ef4444" stroke-width="1.5" />
    <rect x="0" y="0" width="415" height="38" rx="12" fill="#ef4444" opacity="0.12" />
    <text x="18" y="25" class="box-title" fill="#f87171">标准注意力机制 (Standard Attention)</text>
    <rect x="305" y="10" width="95" height="20" rx="4" fill="#ef4444" />
    <text x="312" y="24" class="badge" fill="#fff">Memory Bound</text>

    <!-- Content -->
    <g transform="translate(18, 55)">
      <!-- Step 1 -->
      <rect width="379" height="52" rx="6" fill="#111827" stroke="#374151" stroke-width="1" />
      <text x="12" y="22" class="mono" fill="#fca5a5">1. S = Q · K^T</text>
      <text x="12" y="40" class="label">从 HBM 读 Q, K (2Nd)，计算后向 HBM 写入 S (N²)</text>

      <!-- Step 2 -->
      <rect y="64" width="379" height="52" rx="6" fill="#111827" stroke="#374151" stroke-width="1" />
      <text x="12" y="86" class="mono" fill="#fca5a5">2. P = softmax(S)</text>
      <text x="12" y="104" class="label">从 HBM 读 S (N²)，算完向 HBM 写入 P (N²)</text>

      <!-- Step 3 -->
      <rect y="128" width="379" height="52" rx="6" fill="#111827" stroke="#374151" stroke-width="1" />
      <text x="12" y="150" class="mono" fill="#fca5a5">3. O = P · V</text>
      <text x="12" y="168" class="label">从 HBM 读 P (N²) 与 V (Nd)，向 HBM 写入 O (Nd)</text>

      <!-- Summary -->
      <rect y="194" width="379" height="85" rx="8" fill="#450a0a" stroke="#b91c1c" stroke-width="1" />
      <text x="14" y="218" class="mono" font-weight="bold" fill="#fca5a5">HBM 访存量：O(N² + Nd)</text>
      <text x="14" y="238" class="label" fill="#fecaca">• 随着序列长度 N 增长，显存带宽与显存占用呈二次方爆炸</text>
      <text x="14" y="258" class="label" fill="#fecaca">• 反向传播还需保留 N×N 的 P 矩阵，极端消耗显存！</text>
    </g>
  </g>

  <!-- Right: FlashAttention -->
  <g transform="translate(495, 95)" filter="url(#cardShadow)">
    <rect width="415" height="350" rx="12" fill="url(#cardBg)" stroke="#10b981" stroke-width="1.5" />
    <rect x="0" y="0" width="415" height="38" rx="12" fill="#10b981" opacity="0.12" />
    <text x="18" y="25" class="box-title" fill="#34d399">FlashAttention (算子融合 + 分块计算)</text>
    <rect x="305" y="10" width="95" height="20" rx="4" fill="#059669" />
    <text x="313" y="24" class="badge" fill="#fff">Compute Bound</text>

    <!-- Content -->
    <g transform="translate(18, 55)">
      <!-- Step 1 -->
      <rect width="379" height="52" rx="6" fill="#111827" stroke="#065f46" stroke-width="1" />
      <text x="12" y="22" class="mono" fill="#6ee7b7">1. 块级循环 (Outer &amp; Inner Loop)</text>
      <text x="12" y="40" class="label">仅在 SRAM（高速共享内存）中加载 Q, K, V 分块</text>

      <!-- Step 2 -->
      <rect y="64" width="379" height="52" rx="6" fill="#111827" stroke="#065f46" stroke-width="1" />
      <text x="12" y="86" class="mono" fill="#6ee7b7">2. 融合矩阵乘法与在线 Softmax</text>
      <text x="12" y="104" class="label">S_ij = Q_i · K_j^T, 在片上直接增量更新 m_i, d_i 与 O_i</text>

      <!-- Step 3 -->
      <rect y="128" width="379" height="52" rx="6" fill="#111827" stroke="#065f46" stroke-width="1" />
      <text x="12" y="150" class="mono" fill="#6ee7b7">3. 仅向 HBM 写入最终结果</text>
      <text x="12" y="168" class="label">不落盘任何 N×N 的中间注意力分数矩阵！</text>

      <!-- Summary -->
      <rect y="194" width="379" height="85" rx="8" fill="#064e3b" stroke="#059669" stroke-width="1" />
      <text x="14" y="218" class="mono" font-weight="bold" fill="#a7f3d0">HBM 访存量：O(N²d² / M)</text>
      <text x="14" y="238" class="label" fill="#d1fae5">• M 为高速 SRAM 容量，HBM 访存开销大幅下降数倍至数十倍</text>
      <text x="14" y="258" class="label" fill="#d1fae5">• 显存复杂度从 O(N²) 降至 O(N)，反向传播采用重计算</text>
    </g>
  </g>
</svg>
